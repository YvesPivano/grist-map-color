<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Carte Grist Colorée</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; }
    #map { height: 100vh; width: 100%; display: block; }
    html, body { height: 100%; overflow: hidden; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  
  <script>
    // --- 1. Initialisation de la carte ---
    var map = L.map('map').setView([46.603354, 1.888334], 6);
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap',
      maxZoom: 19
    }).addTo(map);
    
    var markersLayer = L.layerGroup().addTo(map);
    var markersById = {}; 
    var currentSelectedId = null;

    // --- 2. Fonction de couleur (Adaptée pour Booléen) ---
    function getColor(dispositif, isSelected) {
      // true = Vert, false = Rouge (à personnaliser)
      if (dispositif === true) {
        return '#2ecc71'; // Vert (Actif/Présent)
      } else {
        return '#f1c40f'; // Jaune (Inactif/Absent)
      }
    }

    // --- 3. Connexion à Grist ---
    if (typeof grist !== 'undefined') {
      grist.ready({
        columns: [
          { name: 'Latitude', type: 'Any' },
          { name: 'Longitude', type: 'Any' },
          { name: 'Dispositif', type: 'Any' },  // Changé de Statut à Dispositif
          { name: 'Nom', type: 'Any' }
        ],
        allowMultipleSelection: false
      });

      // A. Gestion des données
      grist.onRecords((records) => {
        console.log("Données reçues :", records.length);
        markersLayer.clearLayers();
        markersById = {};
        
        var bounds = [];

        records.forEach(row => {
          if (row.Latitude && row.Longitude) {
            var dispositif = row.Dispositif || false;
            var color = getColor(dispositif, false);
            
            var marker = L.circleMarker([row.Latitude, row.Longitude], {
              radius: row.id === currentSelectedId ? 12 : 8,
              fillColor: color,
              color: "#000",
              weight: row.id === currentSelectedId ? 3 : 1,
              opacity: 1,
              fillOpacity: row.id === currentSelectedId ? 1 : 0.8
            });
            
            // Affichage dans la popup (Vrai/Faux ou Actif/Inactif)
            var statutText = dispositif === true ? 'Actif' : 'Inactif';
            marker.bindPopup(`<b>${row.Nom}</b><br>Dispositif: ${statutText}`);
            markersLayer.addLayer(marker);
            
            markersById[row.id] = marker;
            bounds.push([row.Latitude, row.Longitude]);
          }
        });

        if (bounds.length > 0 && !currentSelectedId) {
          map.fitBounds(bounds, { padding: [50, 50] });
        }
      });

      // B. Gestion de la sélection
      grist.onRecord((record) => {
        console.log("Enregistrement sélectionné :", record);
        
        if (currentSelectedId && markersById[currentSelectedId]) {
          var oldMarker = markersById[currentSelectedId];
          oldMarker.setStyle({
            radius: 8,
            weight: 1,
            fillOpacity: 0.8
          });
        }
        
        currentSelectedId = record.id;
        
        if (currentSelectedId && markersById[currentSelectedId]) {
          var newMarker = markersById[currentSelectedId];
          newMarker.setStyle({
            radius: 12,
            weight: 3,
            fillOpacity: 1
          });
          newMarker.openPopup();
        }
      });
      
      // Gestion du redimensionnement
      grist.on('message', (msg) => {
        if (msg.type === 'resize') {
          setTimeout(() => map.invalidateSize(), 100);
        }
      });
    }
  </script>
</body>
</html>
