<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Carte Grist Colorée</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; }
    #map { height: 100vh; width: 100%; display: block; }
    html, body { height: 100%; overflow: hidden; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  
  <script>
    // --- 1. Initialisation de la carte ---
    var map = L.map('map').setView([46.603354, 1.888334], 6);
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap',
      maxZoom: 19
    }).addTo(map);
    
    var markersLayer = L.layerGroup().addTo(map);
    var markersById = {}; 
    var currentSelectedId = null;

    // --- 2. Fonction de couleur ---
    function getColor(dispositif, isSelected) {
      if (dispositif === true) {
        return '#2ecc71'; // Vert
      } else {
        return '#f1c40f'; // Jaune
      }
    }

    // --- 3. Connexion à Grist ---
    if (typeof grist !== 'undefined') {
      grist.ready({
        columns: [
          { name: 'Latitude', type: 'Any' },
          { name: 'Longitude', type: 'Any' },
          { name: 'Dispositif', type: 'Any' },
          { name: 'Nom', type: 'Any' }  // Vérifiez que ce nom correspond à Grist
        ],
        allowMultipleSelection: false
      });

      grist.onRecords((records) => {
        console.log("Données reçues :", records.length);
        // Debug : afficher la première ligne pour voir les noms de colonnes réels
        if(records.length > 0) console.log("Exemple de donnée :", records[0]);
        
        markersLayer.clearLayers();
        markersById = {};
        
        var bounds = [];

        records.forEach(row => {
          if (row.Latitude && row.Longitude) {
            var dispositif = row.Dispositif || false;
            var color = getColor(dispositif, false);
            
            // Sécurité : si row.Nom est vide, afficher "Point"
            var label = row.Nom || "Point"; 

            var marker = L.circleMarker([row.Latitude, row.Longitude], {
              radius: row.id === currentSelectedId ? 12 : 8,
              fillColor: color,
              color: "#000",
              weight: row.id === currentSelectedId ? 3 : 1,
              opacity: 1,
              fillOpacity: row.id === currentSelectedId ? 1 : 0.8
            });
            
            marker.bindPopup(`<b>${label}</b><br>${dispositif === true ? 'Dispositif' : 'Hors dispositif'}`);
            markersLayer.addLayer(marker);
            
            markersById[row.id] = marker;
            bounds.push([row.Latitude, row.Longitude]);
          }
        });

        if (bounds.length > 0 && !currentSelectedId) {
          map.fitBounds(bounds, { padding: [50, 50] });
        }
      });

      // Gestion de la sélection
      grist.onRecord((record) => {
        if (currentSelectedId && markersById[currentSelectedId]) {
          var oldMarker = markersById[currentSelectedId];
          oldMarker.setStyle({ radius: 8, weight: 1, fillOpacity: 0.8 });
        }
        
        currentSelectedId = record.id;
        
        if (currentSelectedId && markersById[currentSelectedId]) {
          var newMarker = markersById[currentSelectedId];
          newMarker.setStyle({ radius: 12, weight: 3, fillOpacity: 1 });
          newMarker.openPopup();
        }
      });
      
      grist.on('message', (msg) => {
        if (msg.type === 'resize') {
          setTimeout(() => map.invalidateSize(), 100);
        }
      });
    }
  </script>
</body>
</html>
