<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Carte Grist Colorée</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; }
    #map { height: 100vh; width: 100%; display: block; }
    html, body { height: 100%; overflow: hidden; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  
  <script>
    // --- 1. Initialisation de la carte ---
    var map = L.map('map').setView([46.603354, 1.888334], 6);
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap',
      maxZoom: 19
    }).addTo(map);
    
    var markersLayer = L.layerGroup().addTo(map);
    
    // === NOUVEAU : Stocker les marqueurs pour y accéder plus tard ===
    var markersById = {}; 
    var currentSelectedId = null;

    // --- 2. Fonction de couleur ---
    function getColor(statut, isSelected) {
      // Si le point est sélectionné, on le met en évidence (bordure épaisse)
      var baseColor;
      switch (statut) {
        case 'Validé': baseColor = '#2ecc71'; break;
        case 'En cours': baseColor = '#f1c40f'; break;
        case 'Problème': baseColor = '#e74c3c'; break;
        default: baseColor = '#3498db';
      }
      return baseColor;
    }

    // --- 3. Connexion à Grist ---
    if (typeof grist !== 'undefined') {
      grist.ready({
        columns: [
          { name: 'Latitude', type: 'Any' },
          { name: 'Longitude', type: 'Any' },
          { name: 'Statut', type: 'Any' },
          { name: 'Nom', type: 'Any' }
        ],
        allowMultipleSelection: false
      });

      // A. Gestion des données (affichage des points)
      grist.onRecords((records) => {
        console.log("Données reçues :", records.length);
        markersLayer.clearLayers();
        markersById = {}; // Reset du stock
        
        var bounds = [];

        records.forEach(row => {
          if (row.Latitude && row.Longitude) {
            var statut = row.Statut || 'Inconnu';
            var color = getColor(statut, false);
            
            var marker = L.circleMarker([row.Latitude, row.Longitude], {
              radius: row.id === currentSelectedId ? 12 : 8, // Plus gros si sélectionné
              fillColor: color,
              color: row.id === currentSelectedId ? "#000" : "#000",
              weight: row.id === currentSelectedId ? 3 : 1, // Bordure épaisse si sélectionné
              opacity: 1,
              fillOpacity: row.id === currentSelectedId ? 1 : 0.8
            });
            
            marker.bindPopup(`<b>${row.Nom}</b><br>Statut: ${statut}`);
            markersLayer.addLayer(marker);
            
            // === NOUVEAU : Stocker le marqueur avec l'ID Grist ===
            markersById[row.id] = marker;
            
            bounds.push([row.Latitude, row.Longitude]);
          }
        });

        if (bounds.length > 0 && !currentSelectedId) {
          map.fitBounds(bounds, { padding: [50, 50] });
        }
      });

      // === NOUVEAU : B. Gestion de la sélection (clic dans la table) ===
      grist.onRecord((record) => {
        console.log("Enregistrement sélectionné :", record);
        
        // 1. Réinitialiser l'apparence de l'ancien point sélectionné
        if (currentSelectedId && markersById[currentSelectedId]) {
          var oldMarker = markersById[currentSelectedId];
          oldMarker.setStyle({
            radius: 8,
            weight: 1,
            fillOpacity: 0.8
          });
        }
        
        // 2. Mettre à jour le nouvel ID sélectionné
        currentSelectedId = record.id;
        
        // 3. Mettre en surbrillance le nouveau point
        if (currentSelectedId && markersById[currentSelectedId]) {
          var newMarker = markersById[currentSelectedId];
          newMarker.setStyle({
            radius: 12,
            weight: 3,
            fillOpacity: 1
          });
          
          // Optionnel : Ouvrir la popup automatiquement
          newMarker.openPopup();
          
          // Optionnel : Centrer la carte sur le point
          // map.panTo(newMarker.getLatLng());
        }
      });
      
      // Gestion du redimensionnement
      grist.on('message', (msg) => {
        if (msg.type === 'resize') {
          setTimeout(() => map.invalidateSize(), 100);
        }
      });
    }
  </script>
</body>
</html>
