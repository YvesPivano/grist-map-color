<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Carte Grist Colorée</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; }
    #map { height: 100vh; width: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>
  <!-- Script Leaflet pour la carte -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Script Grist Officiel (CDN stable) -->
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  
  <script>
    // --- 1. Initialisation de la carte ---
    var map = L.map('map').setView([46.603354, 1.888334], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);
    var markersLayer = L.layerGroup().addTo(map);

    // --- 2. Fonction de couleur ---
    function getColor(statut) {
      switch (statut) {
        case 'Validé': return '#2ecc71';
        case 'En cours': return '#f1c40f';
        case 'Problème': return '#e74c3c';
        default: return '#3498db';
      }
    }

    // --- 3. Connexion à Grist ---
    if (typeof grist !== 'undefined') {
      // On déclare les colonnes attendues
      grist.ready({
        columns: [
          { name: 'Latitude', type: 'Any' },
          { name: 'Longitude', type: 'Any' },
          { name: 'Statut', type: 'Any' },
          { name: 'Nom', type: 'Any' }
        ],
        allowMultipleSelection: false
      });

      // On écoute les données
      grist.onRecords((records) => {
        console.log("Données reçues :", records.length); // Pour déboguer
        markersLayer.clearLayers();
        
        records.forEach(row => {
          if (row.Latitude && row.Longitude) {
            var statut = row.Statut || 'Inconnu';
            var color = getColor(statut);
            
            var marker = L.circleMarker([row.Latitude, row.Longitude], {
              radius: 8,
              fillColor: color,
              color: "#000",
              weight: 1,
              opacity: 1,
              fillOpacity: 0.8
            });
            marker.bindPopup(`<b>${row.Nom}</b><br>Statut: ${statut}`);
            markersLayer.addLayer(marker);
          }
        });
      });
    } else {
      console.error("L'API Grist n'a pas été chargée.");
    }
  </script>
</body>
</html>
