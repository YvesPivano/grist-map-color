<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Camembert Effectifs Grist</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <style>
    body { margin: 0; padding: 20px; font-family: Arial; }
    #chart-container { position: relative; height: 400px; width: 100%; }
  </style>
</head>
<body>
  <div id="chart-container">
    <canvas id="pieChart"></canvas>
  </div>

  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script>
    let chart;

    if (typeof grist !== 'undefined') {
      grist.ready({
        columns: [
          { name: 'Nom', type: 'Any' },
          { name: 'Dispositif', type: 'Any' },
          { name: 'Effectifs', type: 'Number' }
        ],
        allowMultipleSelection: false
      });

      grist.onRecords((records) => {
        const ctx = document.getElementById('pieChart').getContext('2d');
        
        let actifValue = 0;
        let inactifValue = 0;

        records.forEach(row => {
          const effectif = row.Effectifs || 1;
          if (row.Dispositif === true) {
            actifValue += effectif;
          } else {
            inactifValue += effectif;
          }
        });

        if (chart) {
          chart.destroy();
        }

        let total = actifValue + inactifValue;
        let actifPercent = total > 0 ? ((actifValue / total) * 100).toFixed(1) : 0;
        let inactifPercent = total > 0 ? ((inactifValue / total) * 100).toFixed(1) : 0;

        chart = new Chart(ctx, {
          type: 'pie',
          data: {
            labels: ['Dispositif', 'Hors dispositif'],
            datasets: [{
              data: [actifValue, inactifValue],
              backgroundColor: ['#2ecc71', '#f1c40f'],
              borderColor: ['#ffffff', '#ffffff'],
              borderWidth: 2
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                position: 'bottom',
                labels: { padding: 15, font: { size: 12 } }
              },
              tooltip: {
                enabled: true,
                callbacks: {
                  label: function(context) {
                    let label = context.label || '';
                    let value = context.parsed || 0;
                    let percentage = total > 0 ? ((value / total) * 100).toFixed(1) : 0;
                    return label + ': ' + value + ' personnes (' + percentage + '%)';
                  }
                }
              },
              datalabels: {
                display: true,
                color: '#000000',
                font: { weight: 'bold', size: 14 },
                formatter: function(value) {
                  let percentage = total > 0 ? ((value / total) * 100).toFixed(1) : 0;
                  return value + ' pers.\n(' + percentage + '%)';
                },
                anchor: 'center',
                align: 'center'
              }
            }
          }
        });
      });
    }
  </script>
</body>
</html>
