<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Camembert Effectifs Grist</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <style>
    body { margin: 0; padding: 20px; font-family: Arial; }
    #chart-container { position: relative; height: 400px; width: 100%; }
  </style>
</head>
<body>
  <div id="chart-container">
    <canvas id="pieChart"></canvas>
  </div>

  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script>
    let chart;
    Chart.register(ChartDataLabels);
    if (typeof grist !== 'undefined') {
      // 1. DÉCLARATION EXACTE DES COLONNES
      grist.ready({
        columns: [
          { name: 'Nom', type: 'Any' },
          { name: 'Dispositif', type: 'Any' },
          { name: 'Effectifs', type: 'Any' }  // ← Doit correspondre exactement
        ],
        allowMultipleSelection: false
      });

      grist.onRecords((records) => {
        const ctx = document.getElementById('pieChart').getContext('2d');
        
        let actifValue = 0;
        let inactifValue = 0;

        records.forEach(row => {
          // 2. UTILISATION EXACTE DE LA COLONNE
          // Si Effectifs est vide, on utilise 1 par sécurité
          const effectif = row.Effectifs || 1;
          
          if (row.Dispositif === true) {
            actifValue += effectif;
          } else {
            inactifValue += effectif;
          }
        });

        if (chart) {
          chart.destroy();
        }
        
        // 3. CRÉATION DU GRAPHIQUE
        chart = new Chart(ctx, {
          type: 'pie',
          data: {
            labels: ['Dispositif', 'Hors dispositif'],
            datasets: [{
              data: [actifValue, inactifValue],
              backgroundColor: [
                '#2ecc71', // Vert
                '#f1c40f'  // Jaune
              ],
              borderColor: ['#ffffff', '#ffffff'],
              borderWidth: 2
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                position: 'bottom',
                labels: {
                  padding: 15,
                  font: { size: 12 }
                }
              },
          datalabels: {
            color: '#ffffff',
            font: {
            weight: 'bold',
            size: 14
      },
      formatter: function(value, context) {
  let total = actifValue + inactifValue;
  let percentage = total > 0 ? ((value / total) * 100).toFixed(1) : 0;
  let label = context.chart.data.labels[context.dataIndex];

  return label + '\n' + value + ' élèves\n' + percentage + '%';
}
    },
              tooltip: {
                callbacks: {
                  label: function(context) {
                    let label = context.label || '';
                    let value = context.parsed || 0;
                    let total = actifValue + inactifValue;
                    let percentage = total > 0 ? ((value / total) * 100).toFixed(1) : 0;
                    return `${label}: ${value} élèves (${percentage}%)`;
                  }
                }
              }
            }
          }
        });
      });
    }
  </script>
</body>
</html>
