<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Camembert Effectifs Grist</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { margin: 0; padding: 20px; font-family: Arial; }
    #chart-container { position: relative; height: 400px; width: 100%; }
  </style>
</head>
<body>
  <div id="chart-container">
    <canvas id="pieChart"></canvas>
  </div>

  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script>
    // === PLUGIN PERSONNALISÉ POUR LES LABELS ===
    const customLabelsPlugin = {
      id: 'customLabels',
      afterDraw: function(chart) {
        const ctx = chart.ctx;
        ctx.save();
        ctx.font = 'bold 14px Arial';
        ctx.fillStyle = '#000000';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        const total = chart.data.datasets[0].data.reduce((a, b) => a + b, 0);
        
        chart.getDatasetMeta(0).data.forEach((arc, index) => {
          const value = chart.data.datasets[0].data[index];
          const percentage = total > 0 ? ((value / total) * 100).toFixed(1) : 0;
          
          // Position du label au centre de la tranche
          const position = arc.tooltipPosition();
          
          // Dessiner le texte
          ctx.fillText(value + ' pers.', position.x, position.y - 10);
          ctx.fillText('(' + percentage + '%)', position.x, position.y + 10);
        });
        
        ctx.restore();
      }
    };

    let chart;

    if (typeof grist !== 'undefined') {
      grist.ready({
        columns: [
          { name: 'Nom', type: 'Any' },
          { name: 'Dispositif', type: 'Any' },
          { name: 'Effectifs', type: 'Any' }
        ],
        allowMultipleSelection: false
      });

      grist.onRecords((records) => {
        const ctx = document.getElementById('pieChart').getContext('2d');
        
        let actifValue = 0;
        let inactifValue = 0;

        records.forEach(row => {
          const effectif = row.Effectifs || 1;
          if (row.Dispositif === true) {
            actifValue += effectif;
          } else {
            inactifValue += effectif;
          }
        });

        if (chart) {
          chart.destroy();
        }

        chart = new Chart(ctx, {
          type: 'pie',
           {
            labels: ['Dispositif', 'Hors dispositif'],
            datasets: [{
               [actifValue, inactifValue],
              backgroundColor: [
                '#2ecc71', // Vert
                '#f1c40f'  // Jaune
              ],
              borderColor: ['#ffffff', '#ffffff'],
              borderWidth: 2
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                position: 'bottom',
                labels: {
                  padding: 15,
                  font: { size: 12 }
                }
              },
              tooltip: {
                enabled: true,
                callbacks: {
                  label: function(context) {
                    let label = context.label || '';
                    let value = context.parsed || 0;
                    let total = actifValue + inactifValue;
                    let percentage = total > 0 ? ((value / total) * 100).toFixed(1) : 0;
                    return label + ': ' + value + ' élèves (' + percentage + '%)';
                  }
                }
              }
            }
          },
          // === ENREGISTREMENT DU PLUGIN PERSONNALISÉ ===
          plugins: [customLabelsPlugin]
        });
      });
    }
  </script>
</body>
</html>
