<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Camembert Effectifs Grist</title>
  <!-- Chart.js version 4+ -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { margin: 0; padding: 20px; font-family: Arial; }
    #chart-container { position: relative; height: 400px; width: 100%; }
  </style>
</head>
<body>
  <div id="chart-container">
    <canvas id="pieChart"></canvas>
  </div>

  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script>
    let chart;

    if (typeof grist !== 'undefined') {
      grist.ready({
        columns: [
          { name: 'Nom', type: 'Any' },
          { name: 'Dispositif', type: 'Any' },
          { name: 'Effectifs', type: 'Number' }
        ],
        allowMultipleSelection: false
      });

      grist.onRecords((records) => {
        const ctx = document.getElementById('pieChart').getContext('2d');
        
        let actifValue = 0;
        let inactifValue = 0;

        records.forEach(row => {
          const effectif = row.Effectifs || 1;
          if (row.Dispositif === true) {
            actifValue += effectif;
          } else {
            inactifValue += effectif;
          }
        });

        if (chart) {
          chart.destroy();
        }

        // Calcul des pourcentages pour l'affichage
        let total = actifValue + inactifValue;
        let actifPercent = total > 0 ? ((actifValue / total) * 100).toFixed(1) : 0;
        let inactifPercent = total > 0 ? ((inactifValue / total) * 100).toFixed(1) : 0;

        chart = new Chart(ctx, {
          type: 'pie',
          data: {
            labels: ['Dispositif', 'Hors dispositif'],
            datasets: [{
              data: [actifValue, inactifValue],
              backgroundColor: [
                '#2ecc71', // Vert
                '#f1c40f'  // Jaune
              ],
              borderColor: ['#ffffff', '#ffffff'],
              borderWidth: 2
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              // Affichage des labels NATIFS (sans plugin externe)
              legend: {
                position: 'bottom',
                labels: {
                  padding: 15,
                  font: { size: 12 }
                }
              },
              tooltip: {
                enabled: true
              }
            }
          },
          // Plugin interne pour afficher les données sur les tranches
          plugins: [{
            id: 'customLabels',
            beforeDraw: function(chart) {
              var ctx = chart.ctx;
              ctx.save();
              ctx.font = 'bold 14px Arial';
              ctx.fillStyle = '#000000';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';

              chart.data.datasets[0].data.forEach((value, index) => {
                var meta = chart.getDatasetMeta(0);
                var arc = meta.data[index];
                
                if (arc && arc.tooltipPosition) {
                  var pos = arc.tooltipPosition();
                  var total = actifValue + inactifValue;
                  var percent = total > 0 ? ((value / total) * 100).toFixed(1) : 0;
                  
                  ctx.fillText(value + ' pers.', pos.x, pos.y - 10);
                  ctx.fillText('(' + percent + '%)', pos.x, pos.y + 10);
                }
              });
              ctx.restore();
            }
          }]
        });
      });
    }
  </script>
</body>
</html>
